[package]
name = "multimachine-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
aes-gcm = "0.10"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
regex = "1"
html-escape = "0.2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
 "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
 "Win32_Security", "Win32_Security_Cryptography",
 "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
 "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory",
 "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemServices",
 "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Variant",
 "Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_UI_HiDpi",
 "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
